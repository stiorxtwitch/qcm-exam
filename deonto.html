<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM — Histoire, Déontologie &amp; Éthique</title>
<style>
  :root{
    --ink:#2b2e2c;
    --paper:#f6f3ec;
    --panel:#ffffff;
    --sage:#5c7d6a;
    --sage-dark:#3e5b4c;
    --clay:#c96f4a;
    --clay-soft:#f1d9cd;
    --ok:#4a7c59;
    --ok-bg:#e3efe4;
    --bad:#b4483a;
    --bad-bg:#f6e2dd;
    --line:#d9d3c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:680px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  header.top .mark{
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--sage-dark);
  }
  header.top h1{
    font-size:20px;
    margin:2px 0 0;
    font-weight:600;
    letter-spacing:.01em;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
    font-family:'Courier New',monospace;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--sage);
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--sage-dark);
    white-space:nowrap;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 26px;
    box-shadow:0 1px 0 var(--line);
  }
  .chapter{
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--sage-dark);
    margin-bottom:10px;
  }
  .question{
    font-size:19px;
    line-height:1.45;
    margin:0 0 22px;
    font-weight:600;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    padding:13px 16px;
    font-family:inherit;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
    line-height:1.4;
    transition:border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--sage);}
  .opt:disabled{cursor:default;}
  .opt .letter{
    font-family:'Courier New',monospace;
    font-weight:700;
    color:var(--sage-dark);
    flex-shrink:0;
  }
  .opt.correct{background:var(--ok-bg);border-color:var(--ok);}
  .opt.correct .letter{color:var(--ok);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong .letter{color:var(--bad);}
  .opt.dim{opacity:.55;}

  .abstain-row{margin-top:12px;}
  button.abstain-btn{
    width:100%;
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:12.5px;
    background:none;
    border:1.5px dashed var(--clay);
    color:#7a3a24;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:background .15s;
  }
  button.abstain-btn:hover:not(:disabled){background:var(--clay-soft);}
  button.abstain-btn:disabled{opacity:.45;cursor:default;}
  button.abstain-btn.chosen{background:var(--clay-soft);border-style:solid;}

  .feedback{
    margin-top:20px;
    padding:16px 18px;
    border-radius:8px;
    font-size:15px;
    line-height:1.55;
  }
  .feedback.ok{background:var(--ok-bg);border-left:4px solid var(--ok);}
  .feedback.bad{background:var(--bad-bg);border-left:4px solid var(--bad);}
  .feedback.abst{background:var(--clay-soft);border-left:4px solid var(--clay);}
  .feedback .fb-head{
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
    font-weight:700;
  }
  .feedback.ok .fb-head{color:var(--ok);}
  .feedback.bad .fb-head{color:var(--bad);}
  .feedback.abst .fb-head{color:#7a3a24;}

  .nav-row{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  button.next{
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:13px;
    background:var(--sage-dark);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:11px 20px;
    cursor:pointer;
  }
  button.next:hover{background:var(--sage);}

  .end-card{text-align:center;padding:40px 26px;}
  .end-score{
    font-size:52px;
    font-weight:700;
    color:var(--sage-dark);
    margin:6px 0;
  }
  .end-score span{font-size:22px;color:var(--ink);opacity:.6;}
  .score-detail{
    font-family:'Courier New',monospace;
    font-size:12.5px;
    color:var(--ink);
    opacity:.7;
    margin-bottom:18px;
  }
  .end-msg{font-size:16px;margin:14px 0 6px;line-height:1.5;}
  .end-msg strong{color:var(--sage-dark);}

  .weak-list{
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 20px;
    margin:18px 0 26px;
  }
  .weak-list h3{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--sage-dark);
    margin:0 0 10px;
  }
  .weak-list ul{margin:0;padding-left:20px;}
  .weak-list li{margin-bottom:5px;font-size:14.5px;line-height:1.4;}

  .restart{
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:13px;
    background:none;
    border:1.5px solid var(--sage-dark);
    color:var(--sage-dark);
    border-radius:6px;
    padding:11px 20px;
    cursor:pointer;
  }
  .restart:hover{background:var(--sage-dark);color:#fff;}

  .review-banner{
    background:var(--clay-soft);
    border:1px solid var(--clay);
    border-radius:8px;
    padding:12px 16px;
    font-size:14px;
    margin-bottom:16px;
    color:#7a3a24;
  }

  .card{position:relative;}
  #draw-canvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    touch-action:none;
    z-index:5;
    border-radius:10px;
    pointer-events:none;
  }

  .tools-dock{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:50;
  }
  .tool-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    background:#fff;
    color:var(--sage-dark);
    border:1.5px solid var(--line);
    transition:background .15s, transform .12s, color .15s, border-color .15s;
  }
  .tool-btn:hover{transform:scale(1.06);}
  .tool-btn.active{
    background:var(--clay);
    color:#fff;
    border-color:var(--clay);
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="mark">IRSG / SF — Bloc 1 — Révision</div>
      <h1>Histoire, Déontologie &amp; Éthique</h1>
    </div>
  </header>
  <div id="root"></div>
  <div class="tools-dock">
    <button class="tool-btn" id="pen-toggle-btn" onclick="togglePen()" title="Surligner">🖊️</button>
    <button class="tool-btn" id="clear-draw-btn" onclick="clearDrawing()" title="Effacer le surlignage">🧹</button>
  </div>
</div>

<script>
const QUESTIONS = [

{c:"Ch.1 — Morale vs Éthique", q:"Quelle affirmation distingue correctement la morale de l'éthique selon le cours ?", opts:[
  "La morale est fondée sur l'impératif catégorique de Kant (devoirs, Bien/Mal) ; l'éthique est fondée sur l'impératif hypothétique (bon/mauvais, valeurs relatives)",
  "Il n'est pas faux de dire que l'éthique n'est jamais fondée sur l'impératif hypothétique de Kant",
  "La morale et l'éthique sont toutes deux fondées sur l'impératif hypothétique de Kant, mais s'appliquent à des contextes professionnels différents",
  "La morale répond à la question « Comment vivre ma vie ? » de façon relative, tandis que l'éthique impose des devoirs inconditionnels via l'impératif catégorique"
], correct:0, exp:"La morale, fondée sur l'impératif catégorique de Kant, oppose le Bien et le Mal de façon inconditionnelle. L'éthique, fondée sur l'impératif hypothétique, est relative et conditionnelle. Attention à l'option B : une fois la double négation levée (« il n'est pas faux que l'éthique n'est JAMAIS fondée sur l'hypothétique » = « l'éthique n'est jamais fondée sur l'hypothétique »), l'affirmation devient fausse, puisque c'est justement le cas."},

{c:"Ch.1 — Théories éthiques", q:"Quelle est la différence entre une théorie NON consécutive (déontologique) et une théorie CONSECUTIVE (téléologique) ?", opts:[
  "La théorie non consécutive (déontologique) juge l'acte bon s'il est conforme à la règle morale ; la théorie consécutive (téléologique) juge l'acte bon s'il a des conséquences positives",
  "Il ne serait pas inexact d'affirmer que la théorie consécutive ignore totalement les conséquences des actes qu'elle évalue",
  "La théorie consécutive (déontologique) juge l'acte bon s'il est conforme à la règle morale ; la théorie non consécutive (téléologique) juge l'acte bon s'il a des conséquences positives",
  "Les deux théories, consécutive et non consécutive, jugent l'acte bon uniquement en fonction de ses conséquences, mais à des échelles temporelles différentes"
], correct:0, exp:"Non consécutive = conformité à la règle ; consécutive = conséquences positives (mot-clé CONSÉQUENCE). L'option B, une fois la double négation levée (« il ne serait pas inexact d'affirmer X » = « X est vrai »), prétend que la théorie consécutive ignore totalement les conséquences — absurde, puisque c'est précisément son critère de jugement."},

{c:"Ch.1 — Limites de la réflexion éthique", q:"Parmi les affirmations suivantes sur les limites de la réflexion éthique, laquelle est correcte ?", opts:[
  "La routine apporte du confort dans les soins, mais empêche toute remise en question",
  "Le conformisme correspond à la pression du groupe qui pousse à taire son propre point de vue",
  "L'acharnement éthique correspond au « trop bien faire », qui devient impossible à tenir et génère de la culpabilité",
  "Toutes les propositions ci-dessus sont correctes : ce sont trois limites distinctes décrites dans le cours"
], correct:3, exp:"La routine, le conformisme et l'acharnement éthique sont bien trois limites distinctes de la réflexion éthique présentées dans le cours. Les trois premières propositions sont donc toutes vraies individuellement, ce qui rend la dernière option correcte — piège classique où il fallait éviter de choisir une seule bonne réponse parmi plusieurs."},

{c:"Ch.1 — Étapes de la réflexion éthique", q:"Quelles sont, dans l'ordre, les 4 étapes de la réflexion éthique décrites dans le cours ?", opts:[
  "Il n'est pas exact d'affirmer que l'étape de clarification du problème n'intervient pas en première position, avant l'accueil des émotions, l'analyse par les 4 repères et le choix concerté d'une solution",
  "Accueillir les émotions et jugements spontanés → clarifier le problème → choisir une solution en concertation → analyser à partir des 4 repères",
  "Clarifier le problème → analyser à partir des 4 repères → accueillir les émotions et jugements spontanés → choisir une solution en concertation",
  "Analyser à partir des 4 repères → clarifier le problème → accueillir les émotions et jugements spontanés → choisir seul une solution"
], correct:0, exp:"En levant la double négation (« il n'est pas exact que la clarification n'intervient PAS en premier » = « la clarification intervient bien en premier »), on retrouve l'ordre correct : clarifier le problème → accueillir les émotions → analyser via les 4 repères → choisir en concertation."},

{c:"Ch.2 — Hiérarchie juridique", q:"Dans la hiérarchie des textes juridiques belges, quel est l'ordre correct, du plus haut au moins haut ?", opts:[
  "Textes supranationaux → Constitution → Textes législatifs (lois/décrets/ordonnances) → Textes exécutifs (AR/AM)",
  "Constitution → Textes supranationaux → Textes exécutifs (AR/AM) → Textes législatifs (lois/décrets/ordonnances)",
  "Il ne serait pas incorrect d'affirmer que les textes exécutifs (AR/AM) ne se situent jamais en dessous des textes législatifs dans cette hiérarchie",
  "Textes exécutifs (AR/AM) → Textes législatifs (lois/décrets/ordonnances) → Constitution → Textes supranationaux"
], correct:0, exp:"Du plus haut au moins haut : textes supranationaux, Constitution, textes législatifs, puis textes exécutifs (AR/AM). L'option C, une fois la double négation levée (« il ne serait pas incorrect que les AR/AM ne se situent JAMAIS en dessous des lois » = « les AR/AM ne se situent jamais en dessous »), est fausse : ils leur sont bien inférieurs."},

{c:"Ch.2 — Serment d'Hippocrate", q:"Quelle est l'importance du Serment d'Hippocrate selon le cours ?", opts:[
  "C'est le premier repère déontologique médical, base de la tradition du secret professionnel, avec un caractère universel",
  "Il ne serait pas faux de soutenir que le Serment d'Hippocrate n'a jamais été traduit ni adapté par d'autres cultures que la Grèce antique",
  "C'est un texte à portée uniquement nationale, propre à la Grèce antique, sans influence sur les traditions médicales ultérieures",
  "C'est le texte fondateur de la Déclaration Universelle des Droits de l'Homme, rédigé au 18e siècle"
], correct:0, exp:"Le Serment d'Hippocrate est le premier repère déontologique MÉDICAL, base du secret professionnel, à caractère universel. L'option B, en levant la double négation, affirme qu'il n'a JAMAIS été traduit ni adapté ailleurs qu'en Grèce — c'est faux, c'est justement son caractère universel qui est souligné dans le cours."},

{c:"Ch.2 — Florence Nightingale", q:"Que retenir du rôle de Florence Nightingale pendant la guerre de Crimée (1854) ?", opts:[
  "Elle a fait chuter la mortalité de 42 % à 15 % en deux ans grâce à l'organisation, à l'hôpital de Scutari (1500 blessés)",
  "Elle a fait passer la mortalité de 22 % à 60 % avant de rétablir progressivement la situation, à l'hôpital de Scutari (2500 blessés)",
  "Elle a fait chuter la mortalité de 60 % à 22 % en moins d'un an grâce à l'organisation, à l'hôpital de Londres (2500 blessés)",
  "Aucune des propositions ci-dessus n'est exacte : c'est à l'hôpital de Scutari, avec 2500 blessés, qu'elle a fait chuter la mortalité de 60 % à 22 % en moins d'un an grâce à l'organisation"
], correct:3, exp:"Les trois premières propositions déforment soit les chiffres, soit le sens de l'évolution, soit le lieu (c'est à Scutari, pas à Londres, où elle crée son école plus tard, en 1860). Le fait exact — mortalité de 60 % à 22 % en moins d'un an, à Scutari, pour 2500 blessés — n'était donc listé nulle part ailleurs."},

{c:"Ch.2 — Code de déontologie infirmier belge", q:"Parmi les affirmations suivantes sur le Code de déontologie infirmier belge, laquelle est correcte ?", opts:[
  "Il a été publié en 2004 par l'UGIB, à l'occasion des 30 ans de la loi du 20/12/1974",
  "Il a été modifié en 2018",
  "Il s'applique pendant ET en dehors des heures de travail, car c'est un code moral et non un texte légal",
  "Toutes les propositions ci-dessus sont correctes"
], correct:3, exp:"Les trois affirmations sont vraies simultanément : publication en 2004 par l'UGIB (30e anniversaire de la loi de 1974), modification en 2018, et application permanente puisqu'il s'agit d'un code moral, non légal."},

{c:"Ch.2 — Code de déontologie, Art. 5", q:"Que prévoit l'article 5 du Code de déontologie infirmier belge ?", opts:[
  "Il n'est pas inexact d'affirmer que l'infirmier ne peut jamais refuser d'aider en cas d'urgence, même s'il doit par ailleurs refuser les soins pour lesquels il ne se sait pas compétent en temps normal",
  "L'infirmier doit refuser de réaliser les soins pour lesquels il ne se sait pas compétent, sans exception aucune, même en cas d'urgence vitale",
  "L'infirmier peut réaliser tout soin demandé s'il est encadré par un aide-soignant compétent, quelle que soit sa propre formation",
  "L'infirmier doit référer systématiquement vers un médecin dès qu'un soin technique est demandé, y compris pour les actes B1"
], correct:0, exp:"En levant la double négation (« il n'est pas inexact que l'infirmier ne peut JAMAIS refuser d'aider en urgence » = « il ne peut jamais refuser d'aider en urgence »), on retrouve la règle de l'article 5 : refus possible hors urgence pour incompétence, mais aide adéquate obligatoire en cas d'urgence."},

{c:"Ch.2 — Principes éthiques", q:"Quelle définition correspond au principe de « non-malfaisance » ?", opts:[
  "« Primum non nocere » — ne pas faire de mal (physique, psychologique, social, spirituel), avec un principe de proportionnalité",
  "Il ne serait pas faux de dire que la bienfaisance se limite à ne jamais faire de mal, sans jamais chercher activement le bien du patient",
  "Décider à la place du patient de ce qui est bon pour lui, en s'appuyant sur l'expérience professionnelle",
  "Distribuer équitablement les ressources et les opportunités de soins entre tous les patients"
], correct:0, exp:"La non-malfaisance (« primum non nocere ») consiste à ne pas faire de mal, avec proportionnalité. L'option B mélange volontairement les deux notions : en levant la double négation, elle prétend que la bienfaisance se limite à « ne jamais faire de mal » — c'est en réalité la définition de la non-malfaisance, alors que la bienfaisance consiste à tendre ACTIVEMENT vers le bien. Les options C et D décrivent respectivement le paternalisme et la justice."},

{c:"Ch.2 — Chartes et déclarations", q:"Quelle est la différence entre une charte professionnelle et une déclaration ?", opts:[
  "Une charte est un engagement moral non contraignant pouvant servir d'indice lors d'un jugement ; une déclaration est un texte solennel sans force de loi, à portée symbolique",
  "Une déclaration est un engagement moral non contraignant pouvant servir d'indice lors d'un jugement ; une charte est un texte solennel sans force de loi, à portée symbolique",
  "Il n'est pas inexact de soutenir qu'une déclaration a systématiquement plus de poids juridique qu'une charte, dans tous les contextes",
  "Les deux textes ont exactement la même valeur juridique et peuvent tous deux être invoqués devant un tribunal comme une loi"
], correct:0, exp:"Une charte est un engagement moral pouvant servir d'indice lors d'un jugement ; une déclaration est un texte symbolique sans force de loi. L'option C, en levant la double négation, affirme qu'une déclaration a TOUJOURS plus de poids juridique qu'une charte — faux, aucune des deux n'a de force de loi contraignante."},

{c:"Ch.3 — Loi Aelvoet (2002)", q:"Parmi les affirmations suivantes sur les critères de qualité des soins (loi Aelvoet, 2002), laquelle est correcte ?", opts:[
  "Les soins doivent respecter l'autonomie du patient",
  "Les soins doivent respecter sa dignité",
  "Les soins ne peuvent faire l'objet d'aucune distinction (absence de discrimination)",
  "Toutes les propositions ci-dessus sont correctes"
], correct:3, exp:"Ce sont 3 des 4 critères réels de la loi Aelvoet (le 4e étant la réponse aux besoins du patient, référence à la pyramide de Maslow) ; les trois affirmations proposées sont donc toutes vraies simultanément."},

{c:"Ch.3 — Autonomie", q:"Quelle est la distinction essentielle entre autonomie décisionnelle et autonomie fonctionnelle ?", opts:[
  "L'autonomie décisionnelle = choisir sa propre vie (libre arbitre) ; l'autonomie fonctionnelle = indépendance physique. Un patient peut être dépendant fonctionnellement mais autonome décisionnellement",
  "Il n'est pas faux d'affirmer qu'un patient fonctionnellement dépendant ne peut jamais rester autonome sur le plan décisionnel",
  "Les deux formes d'autonomie évoluent toujours ensemble : un patient dépendant physiquement perd nécessairement sa capacité de décision",
  "L'autonomie décisionnelle ne concerne que les patients en fin de vie, tandis que l'autonomie fonctionnelle s'applique à tous les patients hospitalisés"
], correct:0, exp:"⚠ Point essentiel du cours : AUTONOMIE ≠ DÉPENDANCE. L'option B, une fois la double négation levée, prétend qu'un patient fonctionnellement dépendant ne peut JAMAIS être autonome décisionnellement — c'est exactement l'inverse de ce que le cours enseigne."},

{c:"Ch.3 — Besoins et sexualité", q:"Que retenir concernant le besoin d'amour et la sexualité des patients selon le cours ?", opts:[
  "Le besoin d'amour (affectivité, tendresse, sexualité) est un droit fondamental ; l'OMS (2000) affirme que tous les individus ont droit à une sexualité",
  "Le besoin d'amour est reconnu, mais l'OMS considère la sexualité comme un besoin secondaire ne concernant que les adultes de moins de 65 ans",
  "Le désir s'arrête aux portes de l'hôpital ou de la maison de repos, selon la position officielle de l'OMS depuis 2000",
  "Le manque de considération pour ce besoin chez les aînés s'explique uniquement par le manque de personnel infirmier, non par un manque de formation"
], correct:0, exp:"Le besoin d'amour est un droit fondamental ; l'OMS a affirmé en 2000 que TOUS les individus, sans limite d'âge, ont droit à une sexualité, et que le désir ne s'arrête pas aux portes de l'institution. Le manque de considération s'explique notamment par le manque de formation en sexologie et l'agisme — pas seulement le manque de personnel."},

{c:"Ch.4 — Position des familles", q:"Pourquoi faut-il rester vigilant face à l'implication de certaines familles, selon le cours ?", opts:[
  "Parce que certaines familles font preuve d'infantilisation et prennent un pouvoir abusif sur le patient ; la volonté du PATIENT reste prioritaire",
  "Parce que la volonté de la famille prime toujours sur celle du patient, notamment lorsque celui-ci est âgé",
  "Parce que les familles ne doivent jamais être impliquées dans les décisions de soins, la loi Aelvoet l'interdisant formellement",
  "Parce que la volonté du patient et celle de la famille ont exactement le même poids légal et doivent systématiquement faire consensus"
], correct:0, exp:"Certaines familles peuvent exercer un pouvoir abusif (infantilisation, choix imposé), mais la volonté du PATIENT reste toujours prioritaire — la famille est une alliée, pas une décideuse à sa place, et la loi Aelvoet n'interdit pas son implication."},

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let order = [];           // shuffled global indices for the first pass
let idx = 0;
let mode = "quiz";         // quiz | review | done
let answered = false;
let selected = null;       // displayed index (number) or 'abstain'
let optionOrder = [];      // shuffled original option indices for the current question

let missed = [];           // global indices to send to review (wrong OR abstained)
let reviewQueue = [];
let results = {};          // globalIndex -> 'correct' | 'wrong' | 'abstained' — FIRST PASS ONLY (used for scoring)

// --- Surligneur ---
let drawMode = false;
let strokes = [];          // traits du surlignage pour la question affichée
let currentStroke = null;
let canvasEl = null;
let canvasCtx = null;

const root = document.getElementById('root');

function currentGlobalIndex(){
  return mode==="quiz" ? order[idx] : reviewQueue[idx];
}
function currentQ(){
  return QUESTIONS[currentGlobalIndex()];
}

function prepareQuestion(){
  const q = currentQ();
  optionOrder = shuffleArray(q.opts.map((_,i)=>i)); // les réponses changent de position à chaque affichage
  answered = false;
  selected = null;
  strokes = [];
  currentStroke = null;
}

function initCanvas(){
  canvasEl = document.getElementById('draw-canvas');
  if(!canvasEl){ canvasCtx = null; return; }
  const card = canvasEl.parentElement;
  const rect = card.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvasEl.width = Math.max(1, rect.width * dpr);
  canvasEl.height = Math.max(1, rect.height * dpr);
  canvasEl.style.width = rect.width + 'px';
  canvasEl.style.height = rect.height + 'px';
  canvasCtx = canvasEl.getContext('2d');
  canvasCtx.setTransform(dpr,0,0,dpr,0,0);
  canvasCtx.lineJoin = 'round';
  canvasCtx.lineCap = 'round';
  canvasEl.style.pointerEvents = drawMode ? 'auto' : 'none';

  canvasEl.onpointerdown = function(e){
    if(!drawMode) return;
    const r = canvasEl.getBoundingClientRect();
    currentStroke = [{x:e.clientX-r.left, y:e.clientY-r.top}];
    strokes.push(currentStroke);
    canvasEl.setPointerCapture(e.pointerId);
  };
  canvasEl.onpointermove = function(e){
    if(!drawMode || !currentStroke) return;
    const r = canvasEl.getBoundingClientRect();
    currentStroke.push({x:e.clientX-r.left, y:e.clientY-r.top});
    redrawStrokes();
  };
  canvasEl.onpointerup = function(){ currentStroke = null; };
  canvasEl.onpointercancel = function(){ currentStroke = null; };
  canvasEl.onpointerleave = function(){ currentStroke = null; };

  redrawStrokes();
}

function redrawStrokes(){
  if(!canvasCtx || !canvasEl) return;
  const dpr = window.devicePixelRatio || 1;
  canvasCtx.clearRect(0, 0, canvasEl.width/dpr, canvasEl.height/dpr);
  canvasCtx.strokeStyle = 'rgba(255, 209, 0, 0.55)';
  canvasCtx.lineWidth = 16;
  strokes.forEach(function(stroke){
    if(stroke.length < 2) return;
    canvasCtx.beginPath();
    canvasCtx.moveTo(stroke[0].x, stroke[0].y);
    for(let i=1;i<stroke.length;i++){
      canvasCtx.lineTo(stroke[i].x, stroke[i].y);
    }
    canvasCtx.stroke();
  });
}

function clearDrawing(){
  strokes = [];
  currentStroke = null;
  redrawStrokes();
}

function togglePen(){
  drawMode = !drawMode;
  const btn = document.getElementById('pen-toggle-btn');
  if(btn) btn.classList.toggle('active', drawMode);
  if(canvasEl) canvasEl.style.pointerEvents = drawMode ? 'auto' : 'none';
}

window.addEventListener('resize', function(){
  if(canvasEl){ clearDrawing(); initCanvas(); }
});

function liveScore(){
  let raw = 0;
  Object.values(results).forEach(r=>{
    if(r==='correct') raw += 1;
    else if(r==='wrong') raw -= 0.5;
  });
  return raw;
}

function render(){
  if(mode==="done"){ renderEnd(); return; }
  const q = currentQ();
  const total = mode==="quiz" ? order.length : reviewQueue.length;
  const pct = Math.round((idx)/total*100);
  const letters = ['A','B','C','D'];

  let html = '';
  if(mode==="review"){
    html += `<div class="review-banner">🔁 Reprise des questions ratées / abstenues — répondez correctement pour les valider.</div>`;
  }
  html += `<div class="progress-row">
      <span class="progress-label">${mode==="review"?"Révision":"Question"} ${idx+1}/${total}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${mode==="quiz" ? `<span class="progress-label">Points : ${liveScore()}</span>` : ''}
    </div>`;
  html += `<div class="card">
      <div class="chapter">${q.c}</div>
      <div class="question">${q.q}</div>
      <div class="options">`;
  optionOrder.forEach((originalI, displayedI)=>{
    let cls = "opt";
    if(answered){
      if(originalI===q.correct) cls += " correct";
      else if(displayedI===selected) cls += " wrong";
      else cls += " dim";
    }
    html += `<button class="${cls}" ${answered?"disabled":""} onclick="handleAnswer(${displayedI})">
        <span class="letter">${letters[displayedI]}</span><span>${q.opts[originalI]}</span>
      </button>`;
  });
  html += `</div>`;
  html += `<div class="abstain-row">
      <button class="abstain-btn ${selected==='abstain'?'chosen':''}" ${answered?"disabled":""} onclick="handleAbstain()">Je m'abstiens</button>
    </div>`;
  if(answered){
    const isAbstain = selected==='abstain';
    const isCorrect = !isAbstain && optionOrder[selected]===q.correct;
    const fbClass = isAbstain ? 'abst' : (isCorrect ? 'ok' : 'bad');
    const fbHead = isAbstain ? 'Abstention (0 pt)' : (isCorrect ? 'Correct (+1 pt)' : 'Pas tout à fait (−0.5 pt)');
    html += `<div class="feedback ${fbClass}">
        <div class="fb-head">${fbHead}</div>
        ${q.exp}
      </div>`;
  }
  html += `<canvas id="draw-canvas"></canvas>`;
  html += `</div>`;
  if(answered){
    html += `<div class="nav-row"><button class="next" onclick="nextQuestion()">Suivant →</button></div>`;
  }
  root.innerHTML = html;
  initCanvas();
}

function handleAnswer(displayedI){
  if(answered) return;
  answered = true;
  selected = displayedI;
  clearDrawing();
  const q = currentQ();
  const gIdx = currentGlobalIndex();
  const isCorrect = optionOrder[displayedI]===q.correct;
  if(mode==="quiz"){
    results[gIdx] = isCorrect ? 'correct' : 'wrong';
    if(!isCorrect && !missed.includes(gIdx)) missed.push(gIdx);
  } else if(mode==="review"){
    if(!isCorrect) reviewQueue.push(gIdx);
  }
  render();
}

function handleAbstain(){
  if(answered) return;
  answered = true;
  selected = 'abstain';
  clearDrawing();
  const gIdx = currentGlobalIndex();
  if(mode==="quiz"){
    results[gIdx] = 'abstained';
    if(!missed.includes(gIdx)) missed.push(gIdx);
  } else if(mode==="review"){
    reviewQueue.push(gIdx);
  }
  render();
}

function nextQuestion(){
  idx++;
  if(mode==="quiz"){
    if(idx >= order.length){
      if(missed.length>0){
        mode = "review";
        reviewQueue = missed.slice();
        missed = [];
        idx = 0;
        prepareQuestion();
      } else {
        mode = "done";
      }
    } else {
      prepareQuestion();
    }
  } else if(mode==="review"){
    if(idx >= reviewQueue.length){
      mode = "done";
    } else {
      prepareQuestion();
    }
  }
  render();
}

function buildChapterList(chapters){
  if(chapters.length===0) return '';
  const items = chapters.map(c=>`<li>${c}</li>`).join('');
  return `<div class="weak-list"><h3>Chapitres à relire</h3><ul>${items}</ul></div>`;
}

function renderEnd(){
  const n = QUESTIONS.length;
  let correct=0, wrong=0, abstained=0;
  const wrongChapters = new Set();
  const abstainedChapters = new Set();
  Object.keys(results).forEach(k=>{
    const r = results[k];
    const q = QUESTIONS[k];
    if(r==='correct') correct++;
    else if(r==='wrong'){ wrong++; wrongChapters.add(q.c); }
    else if(r==='abstained'){ abstained++; abstainedChapters.add(q.c); }
  });
  const raw = correct*1 + wrong*(-0.5) + abstained*0;
  const score20 = Math.round((raw/n*20)*10)/10;

  let title, msg, chaptersToShow = [];
  if(score20 < 10.5){
    title = "À retravailler";
    msg = "Vous êtes en dessous de la moyenne. Relisez les chapitres liés aux questions ratées et à celles où vous vous êtes abstenu(e) avant l'examen.";
    chaptersToShow = [...new Set([...wrongChapters, ...abstainedChapters])];
  } else if(wrong>0){
    title = "Très bien !";
    msg = "Vous avez la moyenne, mais quelques points méritent encore d'être relus avant l'examen :";
    chaptersToShow = [...new Set([...wrongChapters, ...abstainedChapters])];
  } else if(abstained>0){
    title = "Excellent !";
    msg = "Vous êtes prêt(e) pour l'examen. Faites tout de même attention aux points suivants, sur lesquels vous avez hésité :";
    chaptersToShow = [...abstainedChapters];
  } else {
    title = "Score parfait !";
    msg = "Score parfait dès le premier passage, sans aucune hésitation — la synthèse est bien intégrée. Vous êtes prêt(e) pour l'examen.";
  }

  root.innerHTML = `
    <div class="card end-card">
      <div class="chapter">Résultat</div>
      <div class="end-score">${score20}<span>/20</span></div>
      <div class="score-detail">${correct} correcte(s) · ${wrong} incorrecte(s) · ${abstained} abstention(s) — soit ${raw} pt(s) sur ${n}</div>
      <div class="end-msg"><strong>${title}</strong><br>${msg}</div>
      ${buildChapterList(chaptersToShow)}
      <button class="restart" onclick="restart()">Recommencer le QCM</button>
    </div>`;
}

function restart(){
  order = shuffleArray(QUESTIONS.map((_,i)=>i));
  idx=0;
  mode="quiz";
  missed=[];
  reviewQueue=[];
  results={};
  prepareQuestion();
  render();
}

restart();
</script>
