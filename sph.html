<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QCM — Soins infirmiers à la personne handicapée</title>
<style>
  :root{
    --ink:#2b2e2c;
    --paper:#f6f3ec;
    --panel:#ffffff;
    --sage:#5c7d6a;
    --sage-dark:#3e5b4c;
    --clay:#c96f4a;
    --clay-soft:#f1d9cd;
    --ok:#4a7c59;
    --ok-bg:#e3efe4;
    --bad:#b4483a;
    --bad-bg:#f6e2dd;
    --line:#d9d3c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:680px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  header.top .mark{
    font-family:'Courier New',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--sage-dark);
  }
  header.top h1{
    font-size:20px;
    margin:2px 0 0;
    font-weight:600;
    letter-spacing:.01em;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
    font-family:'Courier New',monospace;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--sage);
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--sage-dark);
    white-space:nowrap;
  }

  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 26px;
    box-shadow:0 1px 0 var(--line);
  }
  .chapter{
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--sage-dark);
    margin-bottom:10px;
  }
  .question{
    font-size:19px;
    line-height:1.45;
    margin:0 0 22px;
    font-weight:600;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    border:1.5px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    padding:13px 16px;
    font-family:inherit;
    font-size:15.5px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
    line-height:1.4;
    transition:border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--sage);}
  .opt:disabled{cursor:default;}
  .opt .letter{
    font-family:'Courier New',monospace;
    font-weight:700;
    color:var(--sage-dark);
    flex-shrink:0;
  }
  .opt.correct{background:var(--ok-bg);border-color:var(--ok);}
  .opt.correct .letter{color:var(--ok);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong .letter{color:var(--bad);}
  .opt.dim{opacity:.55;}

  .abstain-row{margin-top:12px;}
  button.abstain-btn{
    width:100%;
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:12.5px;
    background:none;
    border:1.5px dashed var(--clay);
    color:#7a3a24;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:background .15s;
  }
  button.abstain-btn:hover:not(:disabled){background:var(--clay-soft);}
  button.abstain-btn:disabled{opacity:.45;cursor:default;}
  button.abstain-btn.chosen{background:var(--clay-soft);border-style:solid;}

  .feedback{
    margin-top:20px;
    padding:16px 18px;
    border-radius:8px;
    font-size:15px;
    line-height:1.55;
  }
  .feedback.ok{background:var(--ok-bg);border-left:4px solid var(--ok);}
  .feedback.bad{background:var(--bad-bg);border-left:4px solid var(--bad);}
  .feedback.abst{background:var(--clay-soft);border-left:4px solid var(--clay);}
  .feedback .fb-head{
    font-family:'Courier New',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:6px;
    font-weight:700;
  }
  .feedback.ok .fb-head{color:var(--ok);}
  .feedback.bad .fb-head{color:var(--bad);}
  .feedback.abst .fb-head{color:#7a3a24;}

  .nav-row{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  button.next{
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:13px;
    background:var(--sage-dark);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:11px 20px;
    cursor:pointer;
  }
  button.next:hover{background:var(--sage);}

  .end-card{text-align:center;padding:40px 26px;}
  .end-score{
    font-size:52px;
    font-weight:700;
    color:var(--sage-dark);
    margin:6px 0;
  }
  .end-score span{font-size:22px;color:var(--ink);opacity:.6;}
  .score-detail{
    font-family:'Courier New',monospace;
    font-size:12.5px;
    color:var(--ink);
    opacity:.7;
    margin-bottom:18px;
  }
  .end-msg{font-size:16px;margin:14px 0 6px;line-height:1.5;}
  .end-msg strong{color:var(--sage-dark);}

  .weak-list{
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 20px;
    margin:18px 0 26px;
  }
  .weak-list h3{
    font-family:'Courier New',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--sage-dark);
    margin:0 0 10px;
  }
  .weak-list ul{margin:0;padding-left:20px;}
  .weak-list li{margin-bottom:5px;font-size:14.5px;line-height:1.4;}

  .restart{
    font-family:'Courier New',monospace;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:13px;
    background:none;
    border:1.5px solid var(--sage-dark);
    color:var(--sage-dark);
    border-radius:6px;
    padding:11px 20px;
    cursor:pointer;
  }
  .restart:hover{background:var(--sage-dark);color:#fff;}

  .review-banner{
    background:var(--clay-soft);
    border:1px solid var(--clay);
    border-radius:8px;
    padding:12px 16px;
    font-size:14px;
    margin-bottom:16px;
    color:#7a3a24;
  }

  #draw-canvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    touch-action:none;
    z-index:5;
    border-radius:10px;
    pointer-events:none;
  }

  .tools-dock{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:50;
  }
  .tool-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    background:#fff;
    color:var(--sage-dark);
    border:1.5px solid var(--line);
    transition:background .15s, transform .12s, color .15s, border-color .15s;
  }
  .tool-btn:hover{transform:scale(1.06);}
  .tool-btn.active{
    background:var(--clay);
    color:#fff;
    border-color:var(--clay);
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="mark">HEPL — Révision</div>
      <h1>Soins infirmiers à la personne handicapée</h1>
    </div>
  </header>
  <div id="root"></div>
  <div class="tools-dock">
    <button class="tool-btn" id="pen-toggle-btn" onclick="togglePen()" title="Surligner">🖊️</button>
    <button class="tool-btn" id="clear-draw-btn" onclick="clearDrawing()" title="Effacer le surlignage">🧹</button>
  </div>
</div>

<script>
const QUESTIONS = [

{c:"Ch.1 — Définitions", q:"Selon la définition de Hamonet (2010), le handicap résulte de quoi ?", opts:[
  "De la confrontation interactive entre les capacités d'une personne et les contraintes de son cadre de vie",
  "Il n'est pas faux de dire que le handicap ne résulte jamais des contraintes du cadre de vie, mais uniquement des capacités propres de la personne",
  "De la confrontation interactive entre le diagnostic médical établi et les contraintes administratives du cadre de vie",
  "D'une évaluation officielle réalisée par une équipe médicale pluridisciplinaire, indépendamment du cadre de vie"
], correct:0, exp:"Hamonet définit le handicap comme la restriction d'activités et de participation résultant de la confrontation interactive entre les capacités de la personne et les contraintes de son cadre de vie. L'option B, une fois la double négation levée (« il n'est pas faux que X ne résulte JAMAIS des contraintes » = « X ne résulte jamais des contraintes »), est fausse : c'est justement de cette confrontation qu'il résulte."},

{c:"Ch.1 — Définitions", q:"Que met en avant la Convention de l'ONU (2006) sur le handicap ?", opts:[
  "L'interaction entre incapacités durables et barrières qui empêche une participation pleine et égale à la société",
  "Il ne serait pas incorrect de soutenir que la Convention ONU ne mentionne jamais la notion de barrières, mais uniquement celle d'incapacités durables",
  "Le handicap comme maladie chronique nécessitant un traitement médical permanent",
  "Le handicap comme incapacité totale et définitive d'exercer une activité professionnelle"
], correct:0, exp:"La Convention ONU 2006 parle de l'interaction entre incapacités durables et barrières empêchant la pleine participation à la société. L'option B, en levant la double négation, affirme que la Convention ne mentionne JAMAIS la notion de barrières — c'est faux, cette interaction est au cœur de la définition."},

{c:"Ch.1 — Caractéristiques", q:"D'après Dessertine (1983), lesquelles NE font PAS partie des 4 caractéristiques du handicap ?", opts:[
  "Notion relative",
  "Situation évolutive",
  "Réalités différentes non réductibles à une seule catégorie",
  "Notion permanente et figée dans le temps, indépendante de l'évolution de la société"
], correct:3, exp:"Les 4 caractéristiques sont : relative, évolutive, recouvrant des réalités différentes, et appréhendée en fonction de l'état de la société. Le handicap n'est justement PAS figé : il est évolutif et dépend du contexte social — l'option D contredit directement cette idée."},

{c:"Ch.1 — Épidémiologie", q:"En Belgique, sur quoi se basent les données épidémiologiques du handicap ?", opts:[
  "L'enquête de l'ISSP (Institut Scientifique de la Santé Publique), en l'absence de base de données officielle",
  "Il n'est pas inexact de dire qu'il n'existe aucune enquête en Belgique sur ce sujet, faute de moyens",
  "Une base de données officielle nationale, gérée par le SPF Santé publique",
  "Le recensement décennal de la population, organisé par Statbel"
], correct:0, exp:"Il n'existe pas de base de données officielle en Belgique : les données reposent sur l'enquête de l'ISSP. L'option B, en levant la double négation, prétend qu'il n'existe AUCUNE enquête — c'est faux, l'enquête de l'ISSP existe bel et bien."},

{c:"Ch.2 — Modèles", q:"Dans le modèle social du handicap, l'origine du handicap est considérée comme :", opts:[
  "Externe à l'individu (produit de la société)",
  "Il ne serait pas faux d'affirmer que le modèle social ne considère jamais l'origine du handicap comme externe à l'individu",
  "Interne à l'individu, comme dans le modèle médical",
  "Liée exclusivement aux facteurs héréditaires et à l'âge de la personne"
], correct:0, exp:"Le modèle social considère le handicap comme un produit social, d'origine externe à l'individu — à l'inverse du modèle médical (option C), où il est intrinsèque à la personne. L'option B, en levant la double négation, affirme l'inverse de la réalité."},

{c:"Ch.2 — CIF", q:"Parmi les affirmations suivantes sur le développement de la CIF (OMS, 2001), laquelle est correcte ?", opts:[
  "Elle a été développée sur une période de 10 ans",
  "65 pays ont participé à son élaboration",
  "Elle a finalement été approuvée par 191 pays",
  "Toutes les propositions ci-dessus sont correctes"
], correct:3, exp:"La CIF a bien été développée sur 10 ans, avec la participation de 65 pays, puis approuvée par 191 pays — les trois affirmations sont simultanément vraies, ce qui rend la dernière option correcte."},

{c:"Ch.2 — CIF", q:"Dans la CIF, l'aspect négatif de la composante « Fonctions organiques et structures anatomiques » s'appelle :", opts:[
  "Déficience",
  "Il n'est pas incorrect de dire que la « déficience » ne concerne jamais les fonctions organiques et structures anatomiques, mais uniquement les activités",
  "Limitation d'activité",
  "Restriction de participation"
], correct:0, exp:"Les fonctions organiques et structures anatomiques, en aspect négatif, donnent des DÉFICIENCES. Les options C et D sont de vrais termes de la CIF, mais rattachés aux mauvaises composantes (respectivement Activité et Participation) — un piège classique de vocabulaire mal apparié."},

{c:"Ch.2 — CIF", q:"La composante « Participation » de la CIF évalue :", opts:[
  "La performance (l'implication réelle dans une situation de vie)",
  "Il ne serait pas faux de soutenir que la performance ne mesure jamais l'implication réelle dans une situation de vie, contrairement à la capacité",
  "La capacité (ce que la personne peut faire en théorie)",
  "Les facteurs personnels uniquement"
], correct:0, exp:"La Participation s'évalue via la performance (implication réelle en situation de vie), à distinguer de la capacité (option C), qui évalue plutôt l'Activité en théorie. L'option B, en levant la double négation, inverse cette réalité."},

{c:"Ch.2 — Facteurs contextuels", q:"Parmi les éléments suivants, lesquels appartiennent aux facteurs PERSONNELS (et non environnementaux) dans la CIF ?", opts:[
  "Le sexe et l'âge de la personne",
  "Le mode de vie et l'éducation",
  "Les expériences passées et la condition physique",
  "Toutes les propositions ci-dessus sont correctes"
], correct:3, exp:"Les facteurs personnels regroupent notamment le sexe, l'âge, le mode de vie, l'éducation, les expériences passées et présentes ainsi que la condition physique — les trois propositions sont donc toutes vraies, à la différence des facteurs environnementaux (bâtiments, services, entourage...)."},

{c:"Ch.3 — Droits", q:"En Belgique, quelle loi lutte contre les discriminations liées au handicap ?", opts:[
  "La loi du 10 mai 2007",
  "La loi du 11 février 2005",
  "La loi du 3 avril 1990",
  "Il ne serait pas incorrect de soutenir que la loi de 2007 ne concerne jamais les discriminations liées au handicap, mais uniquement celles liées à l'âge"
], correct:0, exp:"C'est la loi du 10 mai 2007 qui lutte contre les discriminations liées au handicap. Attention : la loi du 11 février 2005 est une autre loi bien réelle du cours, mais elle concerne le droit à des structures adaptées ; la loi du 3 avril 1990 concerne l'IVG. L'option D, en levant la double négation, contredit directement la loi de 2007."},

{c:"Ch.3 — Droits", q:"Parmi les principes énoncés à l'Article 3 de la CRDPH, lesquels figurent réellement dans la liste des 8 principes ?", opts:[
  "La non-discrimination",
  "L'accessibilité",
  "L'égalité entre hommes et femmes",
  "Toutes les propositions ci-dessus sont correctes"
], correct:3, exp:"Les 8 principes de l'article 3 incluent notamment la dignité/autonomie, la non-discrimination, la participation, le respect de la différence, l'égalité des chances, l'accessibilité, l'égalité hommes-femmes et le respect du développement de l'enfant handicapé — les trois propositions sont donc toutes vraies. La « priorité donnée aux soins curatifs sur l'autonomie », elle, n'en fait pas partie."},

{c:"Ch.3 — Discrimination", q:"Le refus d'entrée dans un restaurant à cause d'un chien d'assistance est un exemple de :", opts:[
  "Discrimination indirecte",
  "Il n'est pas faux d'affirmer que ce refus ne peut jamais être qualifié de discrimination indirecte, car le règlement s'applique à tous les chiens sans exception",
  "Discrimination directe",
  "Refus d'aménagement raisonnable"
], correct:0, exp:"C'est une discrimination INDIRECTE : une disposition apparemment neutre (interdiction des chiens) qui désavantage particulièrement les personnes handicapées. Les options C et D désignent d'autres catégories réelles mais mal appliquées ici. L'option B, en levant la double négation, nie à tort cette qualification."},

{c:"Ch.4 — Étiologie", q:"La trisomie 21 relève de quelle catégorie étiologique de déficience intellectuelle ?", opts:[
  "Génétique",
  "Il ne serait pas incorrect de soutenir que la trisomie 21 ne relève jamais d'une cause génétique, mais uniquement d'une agression périnatale",
  "Biologique (agression périnatale)",
  "Écologique"
], correct:0, exp:"La trisomie 21 est une aberration chromosomique, donc une cause GÉNÉTIQUE. Les options C et D sont d'autres catégories réelles du cours, mais mal appliquées ici. L'option B, en levant la double négation, inverse la réalité."},

{c:"Ch.4 — Retard mental", q:"Selon la classification OMS, à quelle catégorie correspond un QI compris entre 50 et 70 ?", opts:[
  "Retard mental profond (QI < 20)",
  "Retard mental grave (20 < QI < 34)",
  "Retard mental moyen (30 < QI < 49)",
  "Retard mental léger (50 < QI < 70)"
], correct:3, exp:"Léger : 50 < QI < 70, avec scolarisation possible en enseignement adapté. Moyen : 30-49 ; Grave : 20-34 ; Profond : <20. Chaque option ci-dessus associe la bonne plage de QI à un mauvais niveau, sauf la dernière — attention à ne pas se fier uniquement aux chiffres, mais bien à l'association chiffre/niveau."},

{c:"Ch.4 — Trisomie 21", q:"Quelle est la fréquence de la trisomie 21, et comment évolue-t-elle avec l'âge maternel ?", opts:[
  "1/100 naissances en général, montant à 1/1100 si l'âge maternel dépasse 40 ans",
  "1/500 naissances, taux stable quel que soit l'âge maternel",
  "1/50 naissances, montant à 1/10 si l'âge maternel dépasse 40 ans",
  "Aucune des propositions ci-dessus n'est exacte : la fréquence réelle est de 1/1100 naissances, montant à 1/100 après 40 ans"
], correct:3, exp:"Les trois premières propositions inversent le sens de l'évolution ou déforment les chiffres. Le fait exact — 1/1100 naissances en général, montant à 1/100 après 40 ans — n'était donc listé nulle part ailleurs."},

{c:"Ch.4 — TSA", q:"Quelle est la prévalence des Troubles du Spectre de l'Autisme en Belgique et le ratio garçons/filles ?", opts:[
  "1/150, ratio 4 garçons pour 1 fille",
  "Il n'est pas inexact d'affirmer que le ratio garçons/filles dans les TSA n'est jamais favorable aux garçons, contrairement aux idées reçues",
  "1/50, ratio 2 garçons pour 1 fille",
  "1/1000, ratio 1 garçon pour 1 fille"
], correct:0, exp:"La prévalence des TSA en Belgique est de 1/150, avec un ratio de 4 garçons pour 1 fille (trouble apparaissant avant 3 ans). L'option B, en levant la double négation, nie ce déséquilibre pourtant bien réel."},

{c:"Ch.4 — IMOC", q:"Quel type d'IMOC (Infirmité Motrice d'Origine Cérébrale) correspond à la fréquence de 27–37% ?", opts:[
  "IMC ataxique (27–37%)",
  "Tétraplégie spastique (27–37%)",
  "Hémiplégie spastique (27–37%)",
  "IMC dystonique/dyskinétique (27–37%)"
], correct:2, exp:"C'est l'hémiplégie spastique (atteinte d'un hémicorps) qui représente 27 à 37% des cas, la fréquence la plus élevée parmi les types d'IMOC. Les vraies fréquences des autres types sont : tétraplégie spastique 8–32%, IMC dystonique/dyskinétique 4–10%, IMC ataxique 5–7% — chaque option ci-dessus réutilise le bon pourcentage mais l'attribue au mauvais type, sauf la bonne réponse."},

{c:"Ch.4 — Troubles d'apprentissage", q:"Quel lien existe entre dyslexie et dysorthographie ?", opts:[
  "La dysorthographie accompagne la dyslexie dans 2/3 des cas",
  "Il ne serait pas faux de dire que la dysorthographie n'accompagne jamais la dyslexie, ces deux troubles étant totalement indépendants",
  "Ce sont deux noms différents pour un seul et même trouble",
  "La dysorthographie précède systématiquement l'apparition de la dyslexie chez l'enfant"
], correct:0, exp:"La dysorthographie accompagne la dyslexie dans deux tiers des cas — ce sont deux troubles distincts mais fréquemment associés. L'option B, en levant la double négation, nie à tort cette association."},

{c:"Ch.4 — Déficiences motrices", q:"Une lésion de la moelle épinière entraînant une paraplégie relève d'une origine :", opts:[
  "Médullaire / neuromusculaire",
  "Il n'est pas incorrect de soutenir qu'une lésion de la moelle épinière ne relève jamais d'une origine médullaire, mais toujours d'une origine cérébrale",
  "Cérébrale",
  "Ostéoarticulaire"
], correct:0, exp:"Les origines médullaires/neuromusculaires regroupent les lésions de la moelle épinière (tétraplégie, paraplégie), le spina bifida et les maladies neuromusculaires génétiques. L'option C confond volontairement avec l'origine cérébrale (celle de l'IMOC), et l'option B, une fois la double négation levée, affirme l'inverse de la réalité."},

{c:"Ch.4 — Surdité", q:"Une perte auditive de 70 à 90 dB correspond à quel niveau de surdité ?", opts:[
  "Sévère",
  "Il ne serait pas faux d'affirmer qu'une perte auditive de 70 à 90 dB ne correspond jamais à une surdité sévère, mais toujours à une surdité profonde",
  "Légère",
  "Moyenne"
], correct:0, exp:"70–90 dB = surdité SÉVÈRE, pour laquelle l'appareillage est indispensable. Au-delà de 90 dB, la surdité est profonde. L'option B, en levant la double négation, prétend l'inverse."},

{c:"Ch.5 — Dépistage prénatal", q:"À partir de quelle semaine peut-on réaliser le TPNI (test ADN, NIPT) et que dépiste-t-il ?", opts:[
  "Dès la 12ème semaine ; dépiste les trisomies 21, 18, 13 et le sexe",
  "Il n'est pas inexact de dire que le TPNI ne dépiste jamais le sexe de l'enfant, uniquement les anomalies chromosomiques",
  "Dès la 20ème semaine ; dépiste les malformations cardiaques",
  "Dès la 30ème semaine ; dépiste la mucoviscidose"

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let order = [];           // shuffled global indices for the first pass
let idx = 0;
let mode = "quiz";         // quiz | review | done
let answered = false;
let selected = null;       // displayed index (number) or 'abstain'
let optionOrder = [];      // shuffled original option indices for the current question

let missed = [];           // global indices to send to review (wrong OR abstained)
let reviewQueue = [];
let results = {};          // globalIndex -> 'correct' | 'wrong' | 'abstained' — FIRST PASS ONLY (used for scoring)

// --- Surligneur ---
let drawMode = false;
let strokes = [];          // traits du surlignage pour la question affichée
let currentStroke = null;
let canvasEl = null;
let canvasCtx = null;

const root = document.getElementById('root');

function currentGlobalIndex(){
  return mode==="quiz" ? order[idx] : reviewQueue[idx];
}
function currentQ(){
  return QUESTIONS[currentGlobalIndex()];
}

function prepareQuestion(){
  const q = currentQ();
  optionOrder = shuffleArray(q.opts.map((_,i)=>i)); // les réponses changent de position à chaque affichage
  answered = false;
  selected = null;
  strokes = [];
  currentStroke = null;
}

function initCanvas(){
  canvasEl = document.getElementById('draw-canvas');
  if(!canvasEl){ canvasCtx = null; return; }
  const card = canvasEl.parentElement;
  const rect = card.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvasEl.width = Math.max(1, rect.width * dpr);
  canvasEl.height = Math.max(1, rect.height * dpr);
  canvasEl.style.width = rect.width + 'px';
  canvasEl.style.height = rect.height + 'px';
  canvasCtx = canvasEl.getContext('2d');
  canvasCtx.setTransform(dpr,0,0,dpr,0,0);
  canvasCtx.lineJoin = 'round';
  canvasCtx.lineCap = 'round';
  canvasEl.style.pointerEvents = drawMode ? 'auto' : 'none';

  canvasEl.onpointerdown = function(e){
    if(!drawMode) return;
    const r = canvasEl.getBoundingClientRect();
    currentStroke = [{x:e.clientX-r.left, y:e.clientY-r.top}];
    strokes.push(currentStroke);
    canvasEl.setPointerCapture(e.pointerId);
  };
  canvasEl.onpointermove = function(e){
    if(!drawMode || !currentStroke) return;
    const r = canvasEl.getBoundingClientRect();
    currentStroke.push({x:e.clientX-r.left, y:e.clientY-r.top});
    redrawStrokes();
  };
  canvasEl.onpointerup = function(){ currentStroke = null; };
  canvasEl.onpointercancel = function(){ currentStroke = null; };
  canvasEl.onpointerleave = function(){ currentStroke = null; };

  redrawStrokes();
}

function redrawStrokes(){
  if(!canvasCtx || !canvasEl) return;
  const dpr = window.devicePixelRatio || 1;
  canvasCtx.clearRect(0, 0, canvasEl.width/dpr, canvasEl.height/dpr);
  canvasCtx.strokeStyle = 'rgba(255, 209, 0, 0.55)';
  canvasCtx.lineWidth = 16;
  strokes.forEach(function(stroke){
    if(stroke.length < 2) return;
    canvasCtx.beginPath();
    canvasCtx.moveTo(stroke[0].x, stroke[0].y);
    for(let i=1;i<stroke.length;i++){
      canvasCtx.lineTo(stroke[i].x, stroke[i].y);
    }
    canvasCtx.stroke();
  });
}

function clearDrawing(){
  strokes = [];
  currentStroke = null;
  redrawStrokes();
}

function togglePen(){
  drawMode = !drawMode;
  const btn = document.getElementById('pen-toggle-btn');
  if(btn) btn.classList.toggle('active', drawMode);
  if(canvasEl) canvasEl.style.pointerEvents = drawMode ? 'auto' : 'none';
}

window.addEventListener('resize', function(){
  if(canvasEl){ clearDrawing(); initCanvas(); }
});

function liveScore(){
  let raw = 0;
  Object.values(results).forEach(r=>{
    if(r==='correct') raw += 1;
    else if(r==='wrong') raw -= 0.5;
  });
  return raw;
}

function render(){
  if(mode==="done"){ renderEnd(); return; }
  const q = currentQ();
  const total = mode==="quiz" ? order.length : reviewQueue.length;
  const pct = Math.round((idx)/total*100);
  const letters = ['A','B','C','D'];

  let html = '';
  if(mode==="review"){
    html += `<div class="review-banner">🔁 Reprise des questions ratées / abstenues — répondez correctement pour les valider.</div>`;
  }
  html += `<div class="progress-row">
      <span class="progress-label">${mode==="review"?"Révision":"Question"} ${idx+1}/${total}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${mode==="quiz" ? `<span class="progress-label">Points : ${liveScore()}</span>` : ''}
    </div>`;
  html += `<div class="card">
      <div class="chapter">${q.c}</div>
      <div class="question">${q.q}</div>
      <div class="options">`;
  optionOrder.forEach((originalI, displayedI)=>{
    let cls = "opt";
    if(answered){
      if(originalI===q.correct) cls += " correct";
      else if(displayedI===selected) cls += " wrong";
      else cls += " dim";
    }
    html += `<button class="${cls}" ${answered?"disabled":""} onclick="handleAnswer(${displayedI})">
        <span class="letter">${letters[displayedI]}</span><span>${q.opts[originalI]}</span>
      </button>`;
  });
  html += `</div>`;
  html += `<div class="abstain-row">
      <button class="abstain-btn ${selected==='abstain'?'chosen':''}" ${answered?"disabled":""} onclick="handleAbstain()">Je m'abstiens</button>
    </div>`;
  if(answered){
    const isAbstain = selected==='abstain';
    const isCorrect = !isAbstain && optionOrder[selected]===q.correct;
    const fbClass = isAbstain ? 'abst' : (isCorrect ? 'ok' : 'bad');
    const fbHead = isAbstain ? 'Abstention (0 pt)' : (isCorrect ? 'Correct (+1 pt)' : 'Pas tout à fait (−0.5 pt)');
    html += `<div class="feedback ${fbClass}">
        <div class="fb-head">${fbHead}</div>
        ${q.exp}
      </div>`;
  }
  html += `<canvas id="draw-canvas"></canvas>`;
  html += `</div>`;
  if(answered){
    html += `<div class="nav-row"><button class="next" onclick="nextQuestion()">Suivant →</button></div>`;
  }
  root.innerHTML = html;
  initCanvas();
}

function handleAnswer(displayedI){
  if(answered) return;
  answered = true;
  selected = displayedI;
  clearDrawing();
  const q = currentQ();
  const gIdx = currentGlobalIndex();
  const isCorrect = optionOrder[displayedI]===q.correct;
  if(mode==="quiz"){
    results[gIdx] = isCorrect ? 'correct' : 'wrong';
    if(!isCorrect && !missed.includes(gIdx)) missed.push(gIdx);
  } else if(mode==="review"){
    if(!isCorrect) reviewQueue.push(gIdx);
  }
  render();
}

function handleAbstain(){
  if(answered) return;
  answered = true;
  selected = 'abstain';
  clearDrawing();
  const gIdx = currentGlobalIndex();
  if(mode==="quiz"){
    results[gIdx] = 'abstained';
    if(!missed.includes(gIdx)) missed.push(gIdx);
  } else if(mode==="review"){
    reviewQueue.push(gIdx);
  }
  render();
}

function nextQuestion(){
  idx++;
  if(mode==="quiz"){
    if(idx >= order.length){
      if(missed.length>0){
        mode = "review";
        reviewQueue = missed.slice();
        missed = [];
        idx = 0;
        prepareQuestion();
      } else {
        mode = "done";
      }
    } else {
      prepareQuestion();
    }
  } else if(mode==="review"){
    if(idx >= reviewQueue.length){
      mode = "done";
    } else {
      prepareQuestion();
    }
  }
  render();
}

function buildChapterList(chapters){
  if(chapters.length===0) return '';
  const items = chapters.map(c=>`<li>${c}</li>`).join('');
  return `<div class="weak-list"><h3>Chapitres à relire</h3><ul>${items}</ul></div>`;
}

function renderEnd(){
  const n = QUESTIONS.length;
  let correct=0, wrong=0, abstained=0;
  const wrongChapters = new Set();
  const abstainedChapters = new Set();
  Object.keys(results).forEach(k=>{
    const r = results[k];
    const q = QUESTIONS[k];
    if(r==='correct') correct++;
    else if(r==='wrong'){ wrong++; wrongChapters.add(q.c); }
    else if(r==='abstained'){ abstained++; abstainedChapters.add(q.c); }
  });
  const raw = correct*1 + wrong*(-0.5) + abstained*0;
  const score20 = Math.round((raw/n*20)*10)/10;

  let title, msg, chaptersToShow = [];
  if(score20 < 10.5){
    title = "À retravailler";
    msg = "Vous êtes en dessous de la moyenne. Relisez les chapitres liés aux questions ratées et à celles où vous vous êtes abstenu(e) avant l'examen.";
    chaptersToShow = [...new Set([...wrongChapters, ...abstainedChapters])];
  } else if(wrong>0){
    title = "Très bien !";
    msg = "Vous avez la moyenne, mais quelques points méritent encore d'être relus avant l'examen :";
    chaptersToShow = [...new Set([...wrongChapters, ...abstainedChapters])];
  } else if(abstained>0){
    title = "Excellent !";
    msg = "Vous êtes prêt(e) pour l'examen. Faites tout de même attention aux points suivants, sur lesquels vous avez hésité :";
    chaptersToShow = [...abstainedChapters];
  } else {
    title = "Score parfait !";
    msg = "Score parfait dès le premier passage, sans aucune hésitation — la synthèse est bien intégrée. Vous êtes prêt(e) pour l'examen.";
  }

  root.innerHTML = `
    <div class="card end-card">
      <div class="chapter">Résultat</div>
      <div class="end-score">${score20}<span>/20</span></div>
      <div class="score-detail">${correct} correcte(s) · ${wrong} incorrecte(s) · ${abstained} abstention(s) — soit ${raw} pt(s) sur ${n}</div>
      <div class="end-msg"><strong>${title}</strong><br>${msg}</div>
      ${buildChapterList(chaptersToShow)}
      <button class="restart" onclick="restart()">Recommencer le QCM</button>
    </div>`;
}

function restart(){
  order = shuffleArray(QUESTIONS.map((_,i)=>i));
  idx=0;
  mode="quiz";
  missed=[];
  reviewQueue=[];
  results={};
  prepareQuestion();
  render();
}

restart();
</script>
